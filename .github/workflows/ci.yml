name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistema_despesas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_despesas_test
      FRONTEND_URL: http://localhost:3000
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      # Variáveis do Google OAuth ficam de fora de propósito — env.ts trata a ausência das 4
      # juntas como "login com Google desabilitado", não como erro (ver seção 5 do plano).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar segredo efêmero do JWT (só para este job)
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Aplicar migrations no Postgres de serviço
        run: npx prisma migrate deploy

      - name: Build (prisma generate + tsc)
        run: npm run build

      - name: Testes (unitário + integração)
        run: npm test

  build:
    name: Build da imagem (docker compose --profile prod)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir nome e tag da imagem
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${GITHUB_SHA::12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Gerar .env mínimo (só o necessário pra resolver o nome/tag da imagem no build)
        run: |
          cat <<EOF > .env
          API_IMAGE=${{ steps.meta.outputs.image }}
          IMAGE_TAG=${{ steps.meta.outputs.sha_tag }}
          EOF

      - name: Configurar QEMU (emulação ARM64 no runner x86_64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (linux/arm64 — destino são instâncias Graviton/t4g)
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: docker compose --profile prod build

      - name: Salvar imagens (api + migrate) para os próximos jobs
        run: |
          mkdir -p /tmp/images
          docker save \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            "${{ steps.meta.outputs.image }}-migrate:${{ steps.meta.outputs.sha_tag }}" \
            -o /tmp/images/app-images.tar

      - name: Upload das imagens como artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/images/app-images.tar
          retention-days: 1

  smoke-test:
    name: Smoke test (sobe a stack e valida /health)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar imagens do job de build
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Carregar imagens no Docker local
        run: docker load -i /tmp/images/app-images.tar

      - name: Gerar .env efêmero para o smoke test (perfil prod)
        run: |
          cat <<EOF > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=sistema_despesas_ci
          PORT=3001
          FRONTEND_URL=http://localhost:3000
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_IN=7d
          API_IMAGE=${{ needs.build.outputs.image }}
          IMAGE_TAG=${{ needs.build.outputs.sha_tag }}
          EOF

      - name: Configurar QEMU (necessário para executar a imagem ARM64 neste runner x86_64)
        uses: docker/setup-qemu-action@v3

      - name: Subir a stack e aguardar /health
        run: |
          docker compose --profile prod up -d
          for i in $(seq 1 15); do
            if curl -fs "http://localhost:${PORT:-3001}/health"; then
              echo "API respondeu OK"
              exit 0
            fi
            sleep 2
          done
          echo "API não respondeu em tempo — logs:" >&2
          docker compose --profile prod logs
          exit 1

      - name: Derrubar a stack
        if: always()
        run: docker compose --profile prod down -v

  publish:
    name: Publish da imagem (GHCR)
    needs: [build, smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar imagem do job de build
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/images

      - name: Carregar imagem no Docker local
        run: docker load -i /tmp/images/app-images.tar

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR (:sha e :latest)
        run: |
          docker push "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}"
          docker tag "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}" "${{ needs.build.outputs.image }}:latest"
          docker push "${{ needs.build.outputs.image }}:latest"

  dispatch:
    name: Disparar e2e no repo de deploy
    needs: [build, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pede pro repo orquestrador (sistema-controle-despesas-deploy) rodar o
      # e2e contra esta tag exata — se passar, ele re-taggeia esta imagem
      # como :stable.
      - name: Disparar e2e
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gbrlmzl/sistema-controle-despesas-deploy/dispatches \
            -d '{"event_type":"api-published","client_payload":{"image_tag":"${{ needs.build.outputs.sha_tag }}"}}'
